[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matops"
version = "0.2.0"
description = "A tiny backend-neutral matrix/tensor operation layer for NumPy, PyTorch, and CuPy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "torch>=2.0",
]
keywords = ["numpy", "pytorch", "cupy", "cuda", "tensor", "matrix", "backend"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
cupy-cuda12 = ["cupy-cuda12x>=14.0"]
cupy-cuda13 = ["cupy-cuda13x>=14.0"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
